services:

  # ─────────────────────────────────────────────
  # PostgreSQL con estensione pgvector
  # ─────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: sdcc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Garage — Object Storage S3-compatibile
  # ─────────────────────────────────────────────
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: sdcc_garage
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_NAME}
    ports:
      - "3900:3900"   # API S3
      - "3903:3903"   # Admin API
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  # ─────────────────────────────────────────────
  # Backend — Python / FastAPI
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: sdcc_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      MODEL_NAME: ${MODEL_NAME}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app   # hot-reload in sviluppo
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Frontend — Angular compilato + Nginx
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: sdcc_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

# ─────────────────────────────────────────────
# Volumi named (dati persistenti)
# ─────────────────────────────────────────────
volumes:
  pgdata:
  garage_meta:
  garage_data:
