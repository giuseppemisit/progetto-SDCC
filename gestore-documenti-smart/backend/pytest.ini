# ==============================================================================
# CONFIGURAZIONE PYTEST (Suite di verifica)
# ==============================================================================
[pytest]

# ─── 1. COMPORTAMENTO BASE ────────────────────────────────────────────────────
# Dove cercare i test e quali file considerare
testpaths = tests
python_files = test_*.py

# -v: mostra il risultato di ogni singolo test
# --tb=short: in caso di errore stampa solo il traceback essenziale
addopts = -v --tb=short

# ─── 2. ESCLUSIONE SCRIPT MANUALI ─────────────────────────────────────────────
# Ignora la cartella "manual".
# Quegli script eseguono codice a livello globale (tentano connessioni a server
# locali). Se pytest li importasse durante la collection, fallirebbero e
# interromperebbero tutta la suite con "Interrupted: 1 error during collection".
norecursedirs = manual

# ─── 3. ESECUZIONE SEQUENZIALE ─────────────────────────────────────────────────
# Suite tenuta volutamente sequenziale (niente pytest-xdist).
# Usa Testcontainers (Postgres + Garage reali). Librerie AI come PyTorch
# (BLAS/Accelerate) possono generare Segmentation Fault o deadlock in parallelo.
# Preferiamo qualche secondo in più e zero test flaky.
