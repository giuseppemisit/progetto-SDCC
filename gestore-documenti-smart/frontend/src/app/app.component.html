<!-- ============================================================================== -->
<!-- src/app/app.component.html — Template della Shell Applicativa                  -->
<!-- ============================================================================== -->

<app-navbar [mobileOpen]="mobileNavOpen()" (closeMobile)="closeMobileNav()" />

<div class="shell">
  <header class="topbar">
    <button type="button" class="topbar__menu-btn" (click)="toggleMobileNav()" aria-label="Apri il menu di navigazione">
      <svg viewBox="0 0 20 20" fill="none"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor"
        stroke-width="1.6" stroke-linecap="round" /></svg>
    </button>

    <div class="topbar__heading">
      <span class="topbar__sezione">{{ datiRotta().sezione }}</span>
      <h1 class="topbar__titolo">{{ datiRotta().heading }}</h1>
    </div>

    <div class="topbar__actions">
      <a routerLink="/ricerca" class="topbar__action" title="Ricerca avanzata" aria-label="Vai alla ricerca avanzata">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="8.6" cy="8.6" r="5.4" />
          <path d="M16.3 16.3l-3.9-3.9" />
        </svg>
      </a>

      <a routerLink="/documenti/nuovo" class="btn btn--primary btn--sm topbar__cta">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M10 4.5v11M4.5 10h11" />
        </svg>
        <span>Nuovo documento</span>
      </a>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
