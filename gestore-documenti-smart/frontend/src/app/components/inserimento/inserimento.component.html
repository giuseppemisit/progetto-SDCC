<!--
  ============================================================================
  src/app/components/inserimento/inserimento.component.html — Area Inserimento Documenti
  ============================================================================
-->

<div class="ingestion">
  <div class="tabs" role="tablist" aria-label="Modalità di inserimento">
    <button type="button" role="tab" class="tabs__item" [class.is-active]="schedaAttiva() === 'manuale'"
            [attr.aria-selected]="schedaAttiva() === 'manuale'" (click)="selezionaScheda('manuale')">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5.5 2.5h4.6l3 3v9a1 1 0 0 1-1 1h-6.6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z" />
        <path d="M7 9.5h4M7 12h4" />
      </svg>
      Inserimento manuale
    </button>
    <button type="button" role="tab" class="tabs__item" [class.is-active]="schedaAttiva() === 'massivo'"
            [attr.aria-selected]="schedaAttiva() === 'massivo'" (click)="selezionaScheda('massivo')">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 2.7v7.8" /><path d="M6 6.5 9 3.5l3 3" />
        <path d="M3.2 11.8v1.9A1.5 1.5 0 0 0 4.7 15.2h8.6a1.5 1.5 0 0 0 1.5-1.5v-1.9" />
      </svg>
      Caricamento massivo
    </button>
  </div>

  <!-- Pannello che riutilizza lo stesso contenitore per i due flussi di inserimento -->
  <div class="ingestion__panel card">
    @if (schedaAttiva() === 'manuale') {
      <app-documento-form />
    } @else {
      <app-upload-massivo />
    }
  </div>
</div>
