# ==============================================================================
# CONFIGURAZIONE NGINX (Web Server e Reverse Proxy)
# ==============================================================================

server {
    # In ascolto sulla porta 80 (HTTP standard)
    listen 80;
    server_name localhost;

    # ─── 1. FRONTEND (Angular SPA) ────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ─── 2. REVERSE PROXY verso FastAPI ───────────────────────────────────────
    # Tutte le richieste /api/... vengono inoltrate al container backend.
    # Evita problemi CORS: il browser parla sempre con lo stesso host.
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # Inoltra le informazioni reali del client (altrimenti FastAPI vede solo Nginx)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Payload max 12 MB (più alto del limite backend di 10 MB).
        # Così è FastAPI a rispondere con JSON chiaro, non Nginx con errore 413 HTML.
        client_max_body_size 12m;

        # Timeout 5 minuti: operazioni AI lunghe (OCR, embedding su CSV) non devono
        # generare 504 mentre il backend sta ancora elaborando.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ─── 3. FALLBACK ANGULAR (SPA) ────────────────────────────────────────────
    # Se il file non esiste, restituisce index.html.
    # Angular gestisce il routing lato client (evita 404 su refresh o URL diretti).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
