server {
    listen 80;
    server_name localhost;

    # Percorso dentro il container dove finiranno i file Angular compilati
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: tutto ciò che inizia con /api/ vieni inoltrato al backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA: reindirizza a index.html le risorse non trovate,
    # delegando ad Angular la gestione del routing ed evitando errori 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
